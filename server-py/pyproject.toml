[project]
name = "devflow"
version = "0.1.0"
description = "DevFlow Python backend — agent-first requirement lifecycle platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "gunicorn==23.0.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pgvector==0.3.6",
    "redis==5.2.1",
    "arq==0.26.3",
    "minio==7.2.12",
    "casbin==1.41.0",
    "casbin-async-sqlalchemy-adapter==1.6.0",
    "passlib[bcrypt]==1.7.4",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "anthropic==0.43.0",
    "openai==1.59.3",
    "tiktoken==0.8.0",
    "tenacity==9.0.0",
    "structlog==24.4.0",
    "opentelemetry-api==1.29.0",
    "opentelemetry-sdk==1.29.0",
    "opentelemetry-instrumentation-fastapi==0.50b0",
    "opentelemetry-instrumentation-sqlalchemy==0.50b0",
    "prometheus-client==0.21.1",
    "typer==0.15.1",
    "rich==13.9.4",
    "pypdf==5.1.0",
    "python-docx==1.1.2",
    "markdown-it-py==3.0.0",
    "beautifulsoup4==4.12.3",
    "blinker==1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "types-passlib",
]

[project.scripts]
devflow = "devflow.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devflow"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "W"]
ignore = ["S101", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
