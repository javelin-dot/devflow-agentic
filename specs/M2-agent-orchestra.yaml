# M2 Agent Orchestra 业务背景

M1 让 Agent 手动跑起来（人工 ChatWorkspace）；M2 进一步让 Agent 自动编排：

1. **分析编排**：POST /api/analysis/start 并行启动多 Agent，每个 Agent 分析需求并输出 proposedTasks
2. **候选选择**：用户/Agent 在 AnalysisComparePanel 选择最优分析候选
3. **自动落地**：choose 端点自动派生 SubTask、推进 stage 到 development
4. **DAG 调度**：TaskScheduler 按 wave + project 约束执行 SubTask，失败自动创建修复 SubTask
5. **可观测性**：SubTaskPanel 实时展示执行状态

## 关键设计约束（来自 harness/05-stage-gates.md）

- analyzing→development 唯一通道：POST /api/analysis/:id/choose（禁止直接 PATCH stage）
- choose 前校验：analysis.status ∈ {awaiting, done}
- choose 副作用：批量 INSERT sub_tasks + UPDATE requirements.stage='development' + requirements.analysis_chosen_id
- DAG 约束：同 project 串行（inflight set），跨 project 可并行
