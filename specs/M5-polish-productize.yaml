# M5 Polish & Productize 业务背景

全部核心功能（M0-M4+M2.5）完成后，M5 打磨产品化体验：

1. **可观测性**：/api/health 实时暴露系统状态，运维可接入监控
2. **数据安全**：备份下载/恢复上传，单文件 SQLite 极简运维
3. **统计洞察**：DashboardView 展示需求流转效率，识别阶段瓶颈
4. **归档管理**：ArchiveView 让已发布/废弃需求不污染主看板
5. **新用户体验**：OnboardingWizard 引导完成初始配置
6. **可靠性**：ErrorBoundary 防白屏，全局快捷键提效
