# M6 Document Lifecycle 业务背景

## 1. 为什么这是基石里程碑

DevFlow 当前 M0–M5 已经把"看板 / Agent 执行 / 测试 / 发布 / 运维"五条线全部走通，
但**用户描述的六阶段闭环**仍有结构性缺口：

- 阶段 1「需求创建」缺附件 + AI 生成需求 Spec；
- 阶段 2「需求分析」缺结构化的开发设计文档（业务流程图 / 接口 / 数据模型）；
- 全局缺统一的「文档版本 + 通知」基础设施。

M6 集中补齐这三块。完成后：
- R4（测试用例 AI 生成）才有"已确认的设计 Spec"作为输入；
- R5（缺陷自动处理）才有"通知"通道；
- R6（发布闭环）才有"已批准的文档链路"做证据。

## 2. 用户故事

**产品经理**：上传 PRD 图 + 关联需求 → 一键 AI 生成需求 Spec → 在编辑器里改 → 点确认 → 进入分析阶段。
**架构师**：从需求 Spec 派生设计 Spec → AI 输出业务流程图 + 接口列表 + 表结构 → 编辑确认 → 自动派生子任务。
**全员**：已批准的文档被改动 → 5 秒内收到站内通知 + 可选 Webhook → 看到 diff → 重新评估下游。

## 3. UI / 交互

- 需求详情页顶部新增 **AttachmentsPanel**（拖拽 + 缩略图）。
- 需求详情页新增两个 Tab：**「需求 Spec」**、**「设计 Spec」**，均使用 `DocumentEditor`。
- NavSidebar 右上角新增 **NotificationBell**（红点 badge）。
- 文档编辑器右上 `[保存为新版本] [与上一版 diff] [导出 MD]` 三按钮始终可见。

## 4. 非目标

- 不引入用户/角色（保留 local-admin 单用户模式，留 RG-06 / M8）。
- 不实现 PDF / DOCX 导出（留 RG-02 / M7）。
- 不实现文档关联图（留 RG-04 / M7）。
- 不重构 defects 状态机（留 R5-01 / M7）。
- 不实现 PR 审核 / master 回合（留 R6 / M8）。
