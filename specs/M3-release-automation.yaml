# M3 Release Automation 业务背景

M2 让 SubTask 自动执行完毕（development 阶段）；M3 打通后续发布流水线：

1. **MergePublish**：development 完成后，将 dev worktree 分支合并到 uat 分支，触发 CI
2. **Release**：uat 通过后，将 uat 分支合并到 master，执行版本号 bump，触发正式构建
3. **冲突解决**：合并遇到冲突时，状态机暂停，用户在 ConflictResolutionView 解决后恢复
4. **QuickPublish**：直接选择 Jenkins 模板触发构建，不经过 merge 流程
5. **Jenkins 集成**：维护 JenkinsTemplate（job路径+参数模板），变量替换后触发构建

## 关键约束（来自 harness/05-stage-gates.md § 5）

- `prerelease → released` 必须 actor=user，服务端校验 X-Actor header
- 发布完成后 PATCH /requirements/:id { stage:'released' }，服务端自动写 releasedAt
- release_run 必须有 verdict='accepted' 才能推进到 released
