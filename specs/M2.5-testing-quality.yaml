# M2.5 Testing & Quality 业务背景

M2 让 SubTask 自动执行；M2.5 补充验证闭环：

1. **测试计划管理**：为需求维护 TestPlan（含 TestCase 列表），来源可以是验收标准或手动添加
2. **测试执行引擎**：POST /api/test-runs → SSE → spawn 测试命令（npm test/pytest/go test）→ 解析 exit code + 摘要
3. **质量门禁**：预定义 3 条转换门禁（development→uat / uat→prerelease / prerelease→released），逐项执行检查，结果写 gate_checks
4. **缺陷管理**：测试失败 → 手动或自动创建 Defect，关联 reqId + subTaskId，按 severity 跟踪
5. **前端**：TestDashboard 总览 + DefectListPanel + QualityGateModal 拦截转换

## 门禁检查项定义

| 转换 | 检查项（type） | 判定逻辑 |
|------|--------------|---------|
| development→uat | all_subtasks_done | DB: 所有 sub_tasks.status = done |
| development→uat | no_open_defects_p0 | DB: defects.severity=P0 且 status=open 计数=0 |
| development→uat | test_run_pass | 最近一条 test_run.status=passed |
| uat→prerelease | no_open_defects_p0_p1 | P0/P1 open=0 |
| uat→prerelease | acceptance_test_pass | 最近 test_run(type=acceptance).status=passed |
| prerelease→released | regression_pass | 最近 test_run(type=regression).status=passed |
| prerelease→released | no_open_defects_any | 无任何 open defect |
