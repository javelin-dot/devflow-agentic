# M0 Foundation 业务背景

从零搭建 DevFlow v2 研发全生命周期平台的 monorepo 骨架，实现：
1. client/server/shared 三包 workspace 结构
2. 后端：Hono + SQLite + requirements 基础 CRUD + settings API
3. 前端：React 18 + Vite + 看板视图（6列）+ NavSidebar
4. 共享类型包：Stage/Priority/Requirement/STAGE_TRANSITIONS

## 目录结构目标

```
dev-flow-agentein/
├── package.json             # workspace 根，scripts: dev / build
├── tsconfig.base.json
├── client/                  # 前端
│   ├── package.json
│   ├── vite.config.ts       # proxy /api → localhost:4000
│   ├── index.html
│   └── src/
│       ├── main.tsx
│       ├── App.tsx
│       ├── api/
│       │   └── client.ts    # fetch wrapper + hooks
│       ├── views/
│       │   ├── BoardView.tsx
│       │   └── SettingsModal.tsx
│       └── components/
│           └── NavSidebar.tsx
├── server/                  # 后端
│   ├── package.json
│   └── src/
│       ├── index.ts         # Hono app 入口
│       ├── db/
│       │   └── index.ts     # schema + bootstrap()
│       └── routes/
│           ├── requirements.ts
│           └── settings.ts
└── shared/                  # 共享类型
    ├── package.json
    └── src/
        └── index.ts
```
