# M8 Release Closure 业务背景

## 1. 为什么是收尾里程碑

M0–M5 把"看板 + Agent + 测试 + 发布 + 运维"的骨架打通，
M6 补齐了文档抽象与 AI 生成需求/设计 Spec，
M7 补齐了测试与缺陷的工程化闭环，
但发布这一段仍止于"Jenkins 触发"，距离用户描述的「PR 审核 → 生产验证 → 合并回 master → 归档」完整闭环还有 4 步。

M8 把这 4 步全部补齐，同时引入最小可用 RBAC，让 M6/M7 已埋点的角色控制真正生效。完成后 DevFlow 进入"v1.0 GA"状态。

## 2. 用户故事

**开发负责人**：选定需求点 [发起发布] → 系统自动建 release 分支 + 合并各 devBranch + 创建 PR → 我贴 PR 链接给评审人 → 评审通过后系统自动触发 Jenkins → 生产健康检查全绿 → 自动合并回 master → 需求自动归档。
**管理员**：在 SettingsView 加用户、分配角色（pm/dev/qa）→ 普通用户进入系统只能看到自己权限内的操作按钮。
**全员**：超过 30 天前发布的需求不再出现在主看板，但在「历史归档」里仍可只读检索。

## 3. UI / 交互

- **ReleaseView** 顶部时间线展示：preparing → merging → waiting_pr_review → triggering → production_verifying → merged_back，当前态高亮；
- waiting_pr_review 时显示 PR 链接 + 审核人头像 + 状态 badge；
- production_verifying 时 manual 模式给 [验证通过] [验证失败] 两按钮，auto 模式实时显示每个 healthCheckUrl 的状态点；
- **ArchiveView** 默认季度分组（如 "2026 Q2"），可按 workspace/priority/tag 筛选，详情页所有字段只读，admin 角色显示 [恢复] 按钮；
- **LoginView** 首次启动后跳转，提示 local-admin 默认密码并强制修改；
- **SettingsView** 新增「用户管理」分页：admin 可增删改用户、分配角色；非 admin 仅显示自己的资料卡片。

## 4. 非目标

- 不支持 GitLab / Bitbucket（留 M9）；
- 不引入 SSO/LDAP（留 M9 评估）；
- 不实现细粒度操作权限（仅 5 角色 × 4 受控点）；
- 不重构 release_runs 表（现有字段保留兼容）；
- 不实现多实例分布式锁（cron 单机锁即可）。
