# M1 Core Flow 业务背景

在 M0 看板 + CRUD 基础上，接入 AI Agent 执行能力：

1. **项目管理**：扫描本地 Git 仓库，配置分支策略
2. **会话管理**：per-need sessions，绑定 Agent CLI 类型，管理消息历史
3. **Agent 执行**：POST /api/agent/run → SSE 流 → 前端实时渲染
4. **工具审批**：tool_use pending → Approve/Reject → Agent 继续
5. **Worktree**：development 阶段自动在独立目录开发
6. **ActivityView**：全局 events 时间线可观察

## 关键设计约束（来自 harness/01-architecture.md）

- INV-01: 同一 chatSessionId agentLocked=true 后不能换 Agent（返回 409）
- INV-09: 启动时孤儿 pending 消息自动标记 error
- Agent 是**子进程**，不是独立服务；通过 SessionManager 管理
- NormalizedEntry 是所有 Agent 输出的统一格式
