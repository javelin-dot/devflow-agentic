  ClaudeSession 以 stream-json 输出，遇到 tool_use(exec_remote_command) 时
  → logCommandWhitelist 检查 → SshService.exec() 执行 → 结果注入下一轮 →
  最终 AI 给出根因分析和修复建议。
  无真实 SSH 目标时，exec 返回模拟错误；前端仍可正常运行展示流程。

