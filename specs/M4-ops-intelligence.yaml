# M4 Ops Intelligence 业务背景

M3 完成发布流水线；M4 补全运维闭环——上线后发现问题时，可在 DevFlow 内直接用 AI 排查：

1. **日志目标管理**：配置目标主机（IP/SSH凭证/日志目录/glob），按项目+环境分组
2. **SSH 安全执行**：ssh2 建立连接，logCommandWhitelist 过滤危险命令，输出截断 2MB
3. **AI 诊断循环**：ClaudeSession 驱动多轮推理，tool_use 触发 SSH 执行，最多 10 跳
4. **三栏 LogsView**：左侧目标树 + 中间对话+5-Tab结果 + 右侧会话历史

## 关键安全约束

- 白名单命令：tail grep awk sed cat ls find wc head sort uniq cut du df ps
- 禁止符号：> >> ; && || $() 反引号
- 双引号内的 $ 和反引号也要拒绝
- 单次输出上限：2MB（截断并附注"[truncated]"）
- 会话只能访问 scopedTargetIds 内的目标
