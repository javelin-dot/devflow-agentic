# M7 Testing & Defect Engineering 业务背景

## 1. 为什么是 M6 之后

M6 完成后"需求 Spec → 设计 Spec"两文档闭环已就绪，但下游缺陷与测试这条线依然停留在 M2.5 的骨架状态：
- 测试类型与产品口径（冒烟/功能/性能/压力/渗透）不一致；
- 缺陷状态机用通用 open/in_progress/resolved/closed，无法表达"待回归"和"不处理（原因）"；
- 测试报告没有聚合产物，发布评审无证据可看。

M7 集中补齐这三块，让"开发 → 测试 → 缺陷修复 → 报告"形成可循环的工程化通路。

## 2. 用户故事

**QA**：开发设计 Spec 一确认 → 系统自动给我 5–10 条冒烟用例草稿 → 我审改后跑通 → 失败的自动建缺陷草稿。
**开发**：QA 标红的缺陷点「指派 Agent 修复」→ Agent 自己找分支、改代码、跑验证、回归 → 我只看时间线确认。
**产品/项目**：发布评审前下载一份 PDF 报告 → 通过率/失败明细/缺陷清单/性能指标/渗透漏洞 一目了然。

## 3. UI / 交互

- **TestDashboard** 顶部 banner 显示冒烟用例总数 / 通过率 / 最近运行；
- 用例列表按 5 类 `testType` Tab 切换；性能/压力/渗透各自有 type-specific 配置面板；
- **DefectListPanel** 每条缺陷展开时间线，按当前状态显示可达态按钮（如 pending_confirm 显示 [确认修复] [不处理(填原因)]）；
- 缺陷详情右上 [指派 Agent 修复] 按钮触发 DefectFixOrchestrator；
- 需求详情新增 **关联图** Tab：documents + document_links 的 D3 force layout，孤立或上游删除节点标红；
- **DocumentEditor** 右上区永远显示 [导出 MD] [导出 PDF] [导出 DOCX] 三按钮。

## 4. 非目标

- 不引入用户/角色（M8）；缺陷状态变更与文档审批本里程碑仍是 local-admin，但已埋点等 RBAC。
- 不实现性能/压力的图形化趋势（留 M8 收尾）。
- 不引入 LLM 直接执行渗透扫描 —— 仅作 zap-cli/sqlmap 触发器，结果由用户审阅。
