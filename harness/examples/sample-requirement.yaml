# 业务背景

近期被监控发现存在持续密码爆破尝试，每次约 10–50 req/min，
目前登录服务无任何后端限流（仅前端 captcha，已被脚本绕过）。

## 用户故事

- 作为 **安全 / SRE**，我希望被识别为恶意的 IP 在系统层面被自动短期封禁，
  以便不依赖前端 captcha 就能阻断大部分自动化爆破。
- 作为 **合法用户**，如果我连续输错密码被误封，我希望 30 分钟后自动恢复，
  或者通过工单让管理员立即解禁。

## UI / 交互

- 登录页：连续错误时显示"还剩 N 次机会"；触发 423 时显示倒计时。
- 后台：`/admin/unblock` 复用现有页面，不新建。

## 监控

- 新增 metric: `auth_login_blocked_total{ip,reason}`
- 现有 "API 4xx" 面板自动拾取 423。
